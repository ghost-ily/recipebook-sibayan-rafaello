<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<h2>Recipe Book</h2>
	</head>
	<body>
		<p>{{ recipe.name }}</p>
		{% for ingredient in recipe.ingredients.all %}
			<ul>
				<li> {{ingredient.ingredient.name}} </li>
			</ul>
		{% endfor %}
	</body>
</html>
