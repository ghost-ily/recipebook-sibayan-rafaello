{% extends 'base.html' %}

{% block content %}
	<form method="POST" action="{% url 'logout' %}">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit">Logout</button>
	</form>

	{% for recipe in object_list %}
		<ul>
			<li>
				<a href={{recipe.get_absolute_url}}>{{recipe}}</a>
			</li>
		</ul>
	{% endfor %}

{% endblock %}
